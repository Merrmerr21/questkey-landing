kind = "web"
previewPath = "/"
title = "YieldKey"
version = "1.0.0"
id = "artifacts/yieldkey"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 24857
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/yieldkey run dev"

[services.env]
PORT = "24857"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/yieldkey", "run", "build"]
publicDir = "artifacts/yieldkey/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
